<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O X Game - Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⭕ O X Game ❌</h1>
            <p class="subtitle">Classic Tic-Tac-Toe for Two Players</p>
        </header>

        <div class="game-container">
            <!-- Game Info Section -->
            <div class="game-info">
                <div class="player-display">
                    <div class="player-card player-x active" id="playerXCard">
                        <div class="player-icon">❌</div>
                        <div class="player-name">Player X</div>
                        <div class="player-score" id="scoreX">0</div>
                    </div>
                    <div class="vs-divider">VS</div>
                    <div class="player-card player-o" id="playerOCard">
                        <div class="player-icon">⭕</div>
                        <div class="player-name">Player O</div>
                        <div class="player-score" id="scoreO">0</div>
                    </div>
                </div>

                <div class="current-turn" id="currentTurn">
                    <span class="turn-icon">❌</span>
                    <span class="turn-text">Player X's Turn</span>
                </div>
            </div>

            <!-- Game Board -->
            <div class="game-board" id="gameBoard">
                <div class="cell" data-cell-index="0"></div>
                <div class="cell" data-cell-index="1"></div>
                <div class="cell" data-cell-index="2"></div>
                <div class="cell" data-cell-index="3"></div>
                <div class="cell" data-cell-index="4"></div>
                <div class="cell" data-cell-index="5"></div>
                <div class="cell" data-cell-index="6"></div>
                <div class="cell" data-cell-index="7"></div>
                <div class="cell" data-cell-index="8"></div>
            </div>

            <!-- Game Controls -->
            <div class="game-controls">
                <button class="btn btn-primary" id="restartBtn">
                    <span class="btn-icon">🔄</span> Restart Game
                </button>
                <button class="btn btn-secondary" id="resetScoreBtn">
                    <span class="btn-icon">🔢</span> Reset Score
                </button>
            </div>

            <!-- Game Statistics -->
            <div class="game-stats">
                <div class="stat-item">
                    <div class="stat-label">Total Games</div>
                    <div class="stat-value" id="totalGames">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Draws</div>
                    <div class="stat-value" id="drawCount">0</div>
                </div>
            </div>
        </div>

        <footer>
            <p>Built with HTML, CSS & JavaScript | Two-Player Game</p>
        </footer>
    </div>

    <!-- Winner Modal -->
    <div class="modal" id="winnerModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">🎉</div>
            <h2 class="modal-title" id="modalTitle">Player X Wins!</h2>
            <p class="modal-message" id="modalMessage">Congratulations on your victory!</p>
            <div class="modal-buttons">
                <button class="btn btn-primary" id="playAgainBtn">
                    <span class="btn-icon">🎮</span> Play Again
                </button>
                <button class="btn btn-secondary" id="closeModalBtn">
                    <span class="btn-icon">✖️</span> Close
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
